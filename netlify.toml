# Netlify config for the Astranova Next.js (App Router) site.
# Netlify detects Next.js and applies its OpenNext-based Next.js runtime
# (@netlify/plugin-nextjs) automatically — no plugin install needed.
# To pin a runtime version instead: `npm i -D @netlify/plugin-nextjs` and add
#   [[plugins]]
#     package = "@netlify/plugin-nextjs"
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"
  NEXT_TELEMETRY_DISABLED = "1"
  # Set NEXT_PUBLIC_SITE_URL in the Netlify UI (e.g. https://astranovain.com)
  # once the custom domain is approved. Until then Netlify's URL env is used.

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
